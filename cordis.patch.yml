- insert:
    - id: graph-memory
      name: 'graph-memory/dsh'
      config:
        dbPath: !!js dshHomePath('graph-memory/graph-memory.db')
        extractionEnabled: true
        recallEnabled: true
        recallMaxNodes: 6
        recallMaxDepth: 2
        autoRecallMinScore: 0.6
        recallTokenBudget: 4096
        maintenanceInterval: 6
        # Extraction is lossless: these limits bound temporary LLM projections
        # only. Original DSH events remain complete in SQLite. Repeated poison
        # inputs are quarantined for explicit gm_retry_extraction recovery.
        extractionDrain:
          maxBatchChars: 8000
          maxBatchMessages: 15
          existingNamesMaxEntries: 150
          existingNamesMaxChars: 3000
          streamTimeoutMs: 180000
          maxRetries: 2
          retryDelaysMs: [5000, 15000]
          shutdownGraceMs: 30000
        # Durable events are separate from the compacted model surface. The
        # safe default never deletes raw messages. To opt in, first use
        # keep: referenced with dryRun: true and inspect gm_stats/gm_maintain.
        messageRetention:
          keep: all
          recentTurns: 0
          retentionDays: 0
          batchSize: 500
          dryRun: false
        # Graph Memory retains the newest real user turns and asks the agent's
        # public DSH compaction provider to summarize/replace the older prefix.
        contextCompactionEnabled: true
        freshTurnCount: 5
        # Secrets stay outside the bundle and repository. Set these variables
        # in the environment that starts DSH to enable semantic vector recall.
        embedding:
          apiKeyEnv: !!js "process.env.GRAPH_MEMORY_EMBEDDING_API_KEY ? 'GRAPH_MEMORY_EMBEDDING_API_KEY' : undefined"
          baseURL: !!js process.env.GRAPH_MEMORY_EMBEDDING_BASE_URL
          model: !!js process.env.GRAPH_MEMORY_EMBEDDING_MODEL
          dimensions: !!js "process.env.GRAPH_MEMORY_EMBEDDING_DIMENSIONS ? Number(process.env.GRAPH_MEMORY_EMBEDDING_DIMENSIONS) : undefined"
